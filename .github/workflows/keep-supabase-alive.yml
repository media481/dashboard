name: Keep Supabase Alive

# Supabase free tier mem-pause project yang tidak ada request ke API selama 7 hari.
# Workflow ini mengirim 1 request baca ringan tiap 3 hari supaya project tetap aktif.
on:
  schedule:
    # Menit 17 (bukan :00) karena jadwal tepat di awal jam sering tertunda/terlewat
    # di GitHub Actions saat antrean sibuk. Hari ke-1,4,7,...,31 tiap bulan (UTC).
    - cron: '17 3 */3 * *'
  workflow_dispatch: {}

# Izin minimal. `actions: write` hanya dipakai step terakhir untuk mengaktifkan ulang
# workflow ini (lihat penjelasan di sana).
permissions:
  contents: read
  actions: write

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          # Sumber kebenaran tunggal: URL & anon key dibaca dari js/app.js, yaitu project yang
          # benar-benar dipakai aplikasi. (Keduanya memang publik karena dikirim ke browser,
          # jadi tidak perlu secret -- dan tidak bisa lagi menunjuk ke project lain/lama.)
          git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          APP_JS="repo/js/app.js"

          extract() {
            grep -oE "const $1 *= *[\"'][^\"']+[\"']" "$APP_JS" | head -1 | sed -E "s/^[^\"']*[\"']//; s/[\"']\$//"
          }
          url=$(extract SUPABASE_URL | tr -d '[:space:]')
          SUPABASE_ANON_KEY=$(extract SUPABASE_ANON_KEY | tr -d '[:space:]')
          url="${url%/}"

          if ! printf '%s' "$url" | grep -Eq '^https://[a-z0-9]+\.supabase\.co$' || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Tidak bisa membaca SUPABASE_URL / SUPABASE_ANON_KEY dari js/app.js (format 'const SUPABASE_URL = \"...\"' berubah?). Sesuaikan fungsi extract di workflow ini."
            exit 1
          fi
          echo "Host tujuan (dari js/app.js): ${url#https://}"

          # Timeout + retry supaya gangguan jaringan sesaat tidak membuat run gagal.
          # Isi respons tidak dicetak (cukup status HTTP).
          rc=0
          http_code=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 --retry 3 --retry-delay 10 --retry-all-errors \
            "${url}/rest/v1/programs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}") || rc=$?

          echo "HTTP status: ${http_code} (curl exit: ${rc})"

          if [ "$rc" -ne 0 ]; then
            case "$rc" in
              6)  echo "::error::Host ${url#https://} tidak ditemukan (DNS gagal). Project yang dipakai aplikasi (js/app.js) sudah dihapus atau URL-nya salah -- aplikasi juga tidak akan bisa terhubung." ;;
              7)  echo "::error::Koneksi ke ${url#https://} ditolak/gagal. Project mungkin sedang bermasalah atau dijeda." ;;
              28) echo "::error::Timeout menghubungi ${url#https://} (>30 detik, sudah 3x retry)." ;;
              *)  echo "::error::curl gagal (exit ${rc}) saat menghubungi ${url#https://}. Lihat pesan curl di atas." ;;
            esac
            exit 1
          fi

          case "$http_code" in
            200|206)
              echo "✅ Supabase project aktif dan merespons normal."
              ;;
            401|403)
              echo "::error::Supabase menolak key (status ${http_code}). Cek SUPABASE_ANON_KEY di js/app.js."
              exit 1
              ;;
            404)
              echo "::error::Tabel 'programs' tidak ditemukan (404). Kalau tabelnya sudah diganti nama, ubah path di workflow ini."
              exit 1
              ;;
            5*)
              echo "::error::Supabase mengembalikan status ${http_code}. Project mungkin sedang PAUSED: buka dashboard Supabase dan tekan Restore project."
              exit 1
              ;;
            *)
              echo "::error::Ping ke Supabase gagal dengan status ${http_code}"
              exit 1
              ;;
          esac

      # GitHub otomatis menonaktifkan workflow terjadwal di repo yang 60 hari tanpa aktivitas
      # (commit dsb.), sehingga ping berhenti diam-diam. Mengaktifkan ulang workflow ini di
      # tiap run adalah cara yang umum dipakai untuk mereset hitungan itu. Kalau gagal,
      # ping di atas tetap dianggap sukses.
      - name: Jaga workflow tetap aktif
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable "${{ github.workflow }}" --repo "${{ github.repository }}"
