name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secret SUPABASE_URL atau SUPABASE_ANON_KEY belum di-set di repo (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          http_code=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/programs?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: $http_code"
          cat /tmp/response.json

          if [ "$http_code" != "200" ] && [ "$http_code" != "206" ]; then
            echo "::error::Ping ke Supabase gagal dengan status $http_code"
            exit 1
          fi

          echo "✅ Supabase project aktif dan merespons normal."
