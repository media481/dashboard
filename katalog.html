<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Program Umroh Tersedia | Amiru Tour</title>
<meta name="description" content="Daftar program Umroh Amiru Tour yang masih tersedia: jadwal, harga, maskapai, dan hotel.">
<meta property="og:title" content="Program Umroh Tersedia | Amiru Tour">
<meta property="og:description" content="Jadwal, harga, maskapai, dan hotel program Umroh Amiru Tour.">
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FB;--surface:#fff;--ink:#1C2B3A;--ink-soft:#64758A;--brand:#1a355b;--brand-deep:#0f2138;--brand-tint:#dbe4ee;--success:#279E70;--success-tint:#E1F5EC;--warn:#E07B2E;--warn-tint:#FBEBD9;--line:#E1E8F0;--radius:14px;--shadow:0 4px 24px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:"Space Grotesk",Inter,system-ui,sans-serif}
.hero{background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:#fff;padding:calc(14px + env(safe-area-inset-top,0)) 20px 44px}
.wrap{max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.brand img{width:36px;height:36px;border-radius:8px;background:#fff;object-fit:contain;padding:3px}
.brand b{font:700 16px "Space Grotesk",Inter,sans-serif;letter-spacing:.2px}
.brand span{display:block;font-size:12px;opacity:.75}
.hero h1{font-size:clamp(22px,4vw,30px);line-height:1.15;margin-bottom:4px}
.hero p{opacity:.85;max-width:620px;font-size:14px}
.tools{max-width:1180px;margin:-30px auto 0;padding:0 20px;display:flex;gap:10px;flex-wrap:wrap}
.tools input,.tools select{font:inherit;font-size:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);box-shadow:var(--shadow);min-width:0}
.tools input{flex:1 1 240px}
.tools select{flex:0 1 190px}
.tools input:focus,.tools select:focus{outline:2px solid var(--brand);outline-offset:1px}
.meta{max-width:1180px;margin:16px auto 0;padding:0 20px;color:var(--ink-soft);font-size:13px}
.grid{max-width:1180px;margin:14px auto 40px;padding:0 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.12)}
.poster{position:relative;aspect-ratio:4/5;background:var(--brand-tint);cursor:pointer;overflow:hidden;border:0;padding:0;width:100%;display:block}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.poster .ph{height:100%;display:grid;place-items:center;color:var(--brand);font:600 14px Inter,sans-serif;padding:20px;text-align:center}
.badges{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:#fff;color:var(--brand);box-shadow:0 1px 6px rgba(0,0,0,.15)}
.badge.near{background:var(--warn-tint);color:#A5541A}
.badge.new{background:var(--success-tint);color:var(--success)}
.body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h3{font-size:18px;line-height:1.25}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px}
.facts div small{display:block;color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
.facts div b{font-weight:600}
.price{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line)}
.price small{color:var(--ink-soft);font-size:12px}
.price strong{display:block;font:700 21px "Space Grotesk",Inter,sans-serif;color:var(--brand)}
.actions{display:flex;gap:8px}
.btn{flex:1;font:600 14px Inter,sans-serif;text-align:center;text-decoration:none;padding:11px 12px;border-radius:10px;border:1px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer}
.btn.primary{background:var(--brand);color:#fff}
.btn.wa{background:#25D366;border-color:#25D366;color:#fff}
.btn:hover{filter:brightness(.95)}
.state{max-width:1180px;margin:40px auto;padding:40px 20px;text-align:center;color:var(--ink-soft)}
.skel{height:420px;border-radius:var(--radius);background:linear-gradient(90deg,#eaeff5 25%,#f4f7fb 50%,#eaeff5 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.modal{position:fixed;inset:0;background:rgba(15,33,56,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.sheet{background:#fff;border-radius:var(--radius);max-width:720px;width:100%;max-height:92dvh;overflow:auto;position:relative}
.sheet header{padding:18px 20px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;gap:12px}
.sheet header h2{font-size:20px}
.x{border:0;background:var(--brand-tint);color:var(--brand);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer;flex:none}
.sheet .in{padding:16px 20px 22px;display:grid;gap:16px}
.sheet img.big{width:100%;border-radius:12px;display:block}
.sheet h4{font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft);margin-bottom:6px}
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.prices div{background:var(--bg);border-radius:10px;padding:10px}
.prices small{color:var(--ink-soft);font-size:11px;display:block}
.prices b{font-size:14px}
.sheet ul{padding-left:20px;font-size:14px;display:grid;gap:3px}
footer{text-align:center;color:var(--ink-soft);font-size:12px;padding:10px 20px calc(30px + env(safe-area-inset-bottom,0))}
@media(max-width:520px){.tools select{flex:1 1 100%}.hero p{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section class="hero"><div class="wrap">
  <div class="brand"><img src="logo-amirutour.png" alt="Logo Amiru Tour" onerror="this.style.display='none'"><div><b>Amiru Tour</b><span>PT Amiru Haramain Indonesia</span></div></div>
  <h1>Program Umroh Tersedia</h1>
  <p>Pilih jadwal keberangkatan, maskapai, dan hotel yang sesuai. Harga dan jadwal diperbarui otomatis.</p>
</div></section>

<div class="tools">
  <input id="q" type="search" placeholder="Cari nama program, maskapai, hotel..." aria-label="Cari program" autocomplete="off">
  <select id="sort" aria-label="Urutkan"><option value="date">Keberangkatan terdekat</option><option value="low">Harga termurah</option><option value="high">Harga termahal</option></select>
</div>
<div class="meta" id="meta" aria-live="polite"></div>
<main class="grid" id="grid" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
<footer>Harga dan jadwal dapat berubah sewaktu-waktu mengikuti ketentuan Saudi, maskapai, dan kurs. Hubungi kami untuk informasi terbaru.</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="sheet">
  <header><h2 id="mTitle"></h2><button class="x" id="mClose" aria-label="Tutup">&times;</button></header>
  <div class="in" id="mBody"></div>
</div></div>

<script>
// ===== KONFIGURASI =====
const SUPABASE_URL = "https://vlrizloxsjejcfuxuyju.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZscml6bG94c2plamNmdXh1eWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxOTE1NjMsImV4cCI6MjEwMTc2NzU2M30.hO5LGq4CwiZDG4hxU2cEB1nNaVdpJ5NepPZLIIA1fig"; // anon key memang publik; data dilindungi RLS
const WA_NUMBER = "";   // isi nomor WhatsApp admin format internasional tanpa +, mis. "6281234567890". Kosong = tombol WA disembunyikan
const BARU_HARI = 3;    // badge "Baru" tampil selama N hari sejak program dibuat

const BULAN = {Januari:0,Februari:1,Maret:2,April:3,Mei:4,Juni:5,Juli:6,Agustus:7,September:8,Oktober:9,November:10,Desember:11};
let semua = [], tampil = [];

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; };

function parseTgl(s) {
  if (!s) return null;
  for (const [nama, i] of Object.entries(BULAN)) {
    if (s.includes(nama)) {
      const p = s.trim().split(/\s+/);
      const d = parseInt(p[0], 10), y = parseInt(p[2], 10);
      if (!isNaN(d) && !isNaN(y)) return new Date(y, i, d);
    }
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function angka(v) { const d = String(v ?? '').replace(/[^\d]/g, ''); return d ? parseInt(d, 10) : 0; }
function rupiah(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'string' && /[^\d.,\s]/.test(v)) return v.trim();   // sudah terformat, mis. "Rp 32.500.000"
  const n = angka(v);
  return n ? new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', maximumFractionDigits:0}).format(n) : '';
}
function posterSrc(u) {
  u = safeUrl(u);
  const m = u.match(/drive\.google\.com\/file\/d\/([\w-]+)/) || u.match(/drive\.google\.com\/open\?id=([\w-]+)/);
  return m ? `https://drive.google.com/thumbnail?id=${m[1]}&sz=w800` : u;
}
function estimasi(d) {
  const t = new Date(); t.setHours(0,0,0,0);
  const diff = Math.round((d - t) / 864e5);
  if (diff <= 0) return 'Hari ini';
  if (diff < 31) return diff + ' hari lagi';
  const bln = Math.floor(diff / 30);
  return bln + ' bulan' + (diff % 30 ? ' ' + (diff % 30) + ' hari' : '') + ' lagi';
}
function daftarList(v) {
  if (Array.isArray(v)) return v.map(String).filter(Boolean);
  if (typeof v === 'string') return v.split('\n').map(x => x.replace(/^[-•*\s]+/, '').trim()).filter(Boolean);
  return [];
}
function hargaUtama(p) { return angka(p.harga_quad) || angka(p.harga_quint) || angka(p.harga_triple) || angka(p.harga_double); }

async function muat() {
  const grid = document.getElementById('grid');
  try {
    const sel = 'id,nama,tgl,durasi,maskapai,harga_quint,link_itinerary,link_poster,created_at,is_active,admin_data_lengkap';
    const r = await fetch(`${SUPABASE_URL}/rest/v1/programs?select=${sel}&order=created_at.asc`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    const now = new Date(); now.setHours(0,0,0,0);
    semua = rows.map(row => {
      let adl = row.admin_data_lengkap;
      if (typeof adl === 'string') { try { adl = JSON.parse(adl); } catch { adl = {}; } }
      return { ...row, ...(adl || {}), dateObj: parseTgl(row.tgl) };
    }).filter(p => p.is_active !== false && p.link_poster && (!p.dateObj || p.dateObj >= now));
    // 3 keberangkatan terdekat
    const terdekat = new Set([...semua].filter(p => p.dateObj).sort((a,b) => a.dateObj - b.dateObj).slice(0,3).map(p => String(p.id)));
    semua.forEach(p => { p._near = terdekat.has(String(p.id)); const c = new Date(p.created_at); p._baru = !isNaN(c) && (Date.now() - c) < BARU_HARI * 864e5; });
    grid.setAttribute('aria-busy', 'false');
    render();
  } catch (e) {
    console.error(e);
    grid.outerHTML = '<div class="state" id="grid"><p><b>Gagal memuat program.</b></p><p>Periksa koneksi internet lalu coba lagi.</p><p style="margin-top:14px"><button class="btn primary" style="flex:none;padding:10px 22px" onclick="location.reload()">Muat ulang</button></p></div>';
  }
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const mode = document.getElementById('sort').value;
  tampil = semua.filter(p => !q || [p.nama, p.maskapai, p.hotel_makkah, p.hotel_madinah, p.tgl].join(' ').toLowerCase().includes(q));
  tampil.sort((a, b) => mode === 'low' ? (hargaUtama(a) || 1e12) - (hargaUtama(b) || 1e12)
                      : mode === 'high' ? hargaUtama(b) - hargaUtama(a)
                      : (a.dateObj || 0) - (b.dateObj || 0));
  document.getElementById('meta').textContent = tampil.length ? tampil.length + ' program tersedia' : '';
  const grid = document.getElementById('grid');
  if (!tampil.length) {
    grid.innerHTML = '<div class="state" style="grid-column:1/-1"><p><b>' + (semua.length ? 'Tidak ada program yang cocok.' : 'Belum ada program tersedia saat ini.') + '</b></p></div>';
    return;
  }
  grid.innerHTML = tampil.map((p, i) => {
    const harga = rupiah(p.harga_quad || p.harga_quint);
    const lbl = p.harga_quad ? 'Mulai dari (quad)' : 'Mulai dari';
    const iti = safeUrl(p.link_itinerary);
    return `<article class="card">
      <button class="poster" data-i="${i}" aria-label="Lihat detail ${esc(p.nama)}">
        <img src="${esc(posterSrc(p.link_poster))}" alt="Poster ${esc(p.nama)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',textContent:'${esc(p.nama).replace(/'/g,'')}'}))">
        <div class="badges">${p._near ? '<span class="badge near">Terdekat</span>' : ''}${p._baru ? '<span class="badge new">Baru</span>' : ''}</div>
      </button>
      <div class="body">
        <h3>${esc(p.nama)}</h3>
        <div class="facts">
          <div><small>Berangkat</small><b>${esc(p.tgl || '-')}</b></div>
          <div><small>Durasi</small><b>${esc(p.durasi || '-')}</b></div>
          <div><small>Maskapai</small><b>${esc(p.maskapai || '-')}</b></div>
          <div><small>Estimasi</small><b>${p.dateObj ? esc(estimasi(p.dateObj)) : '-'}</b></div>
        </div>
        ${harga ? `<div class="price"><small>${lbl}</small><strong>${esc(harga)}</strong></div>` : ''}
        <div class="actions">
          <button class="btn primary" data-i="${i}">Detail</button>
          ${WA_NUMBER ? `<a class="btn wa" target="_blank" rel="noopener" href="${waLink(p)}">Tanya via WA</a>` : (iti ? `<a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(iti)}">Itinerary</a>` : '')}
        </div>
      </div></article>`;
  }).join('');
}

function waLink(p) {
  const t = `Assalamu'alaikum, saya tertarik dengan program "${p.nama}" (berangkat ${p.tgl || '-'}). Mohon info lebih lanjut.`;
  return 'https://wa.me/' + encodeURIComponent(WA_NUMBER) + '?text=' + encodeURIComponent(t);
}

function buka(i) {
  const p = tampil[i]; if (!p) return;
  document.getElementById('mTitle').textContent = p.nama || '';
  const kamar = [['Quint', p.harga_quint], ['Quad', p.harga_quad], ['Triple', p.harga_triple], ['Double', p.harga_double]].filter(k => rupiah(k[1]));
  const hotel = [['Makkah', p.hotel_makkah], ['Madinah', p.hotel_madinah], [p.hotel_3_kota || 'Hotel 3', p.hotel_3], [p.hotel_4_kota || 'Hotel 4', p.hotel_4]].filter(h => h[1]);
  const inc = daftarList(p.termasuk), exc = daftarList(p.tidak_termasuk);
  const iti = safeUrl(p.link_itinerary);
  document.getElementById('mBody').innerHTML = `
    <img class="big" src="${esc(posterSrc(p.link_poster))}" alt="Poster ${esc(p.nama)}" referrerpolicy="no-referrer" onerror="this.remove()">
    <div class="facts"><div><small>Berangkat</small><b>${esc(p.tgl || '-')}</b></div><div><small>Durasi</small><b>${esc(p.durasi || '-')}</b></div><div><small>Maskapai</small><b>${esc(p.maskapai || '-')}</b></div></div>
    ${kamar.length ? `<div><h4>Harga per orang</h4><div class="prices">${kamar.map(k => `<div><small>${k[0]}</small><b>${esc(rupiah(k[1]))}</b></div>`).join('')}</div></div>` : ''}
    ${hotel.length ? `<div><h4>Akomodasi</h4><ul>${hotel.map(h => `<li><b>${esc(h[0])}:</b> ${esc(h[1])}</li>`).join('')}</ul></div>` : ''}
    ${inc.length ? `<div><h4>Termasuk</h4><ul>${inc.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    ${exc.length ? `<div><h4>Tidak termasuk</h4><ul>${exc.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
    <div class="actions">${iti ? `<a class="btn" target="_blank" rel="noopener noreferrer" href="${esc(iti)}">Lihat Itinerary</a>` : ''}${WA_NUMBER ? `<a class="btn wa" target="_blank" rel="noopener" href="${waLink(p)}">Tanya via WhatsApp</a>` : ''}</div>`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('mClose').focus();
}
function tutup() { document.getElementById('modal').classList.remove('open'); document.body.style.overflow = ''; }

document.getElementById('grid').addEventListener('click', e => { const t = e.target.closest('[data-i]'); if (t) buka(+t.dataset.i); });
document.getElementById('mClose').addEventListener('click', tutup);
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') tutup(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') tutup(); });
document.getElementById('q').addEventListener('input', render);
document.getElementById('sort').addEventListener('change', render);
muat();
</script>
</body>
</html>
